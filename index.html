
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANKED ISLAND</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b2b;color:white;font-family:Arial,sans-serif}
button{padding:14px 25px;border:0;border-radius:8px;background:#ffb52e;font-weight:bold;cursor:pointer;margin:5px}
#lobby{text-align:center;padding:45px 15px}
h1{font-size:55px;margin:15px}
#game{display:none;position:fixed;inset:0}
canvas{display:block}
#hud{position:absolute;top:15px;left:15px;right:15px;pointer-events:none;font-weight:bold;text-shadow:1px 2px 4px black}
#help{position:absolute;bottom:15px;left:15px;text-shadow:1px 2px 4px black}
#exit{position:absolute;right:15px;bottom:15px;pointer-events:auto}
</style>
</head>
<body>

<div id="lobby">
<h2>RANKED ISLAND</h2>
<p>SEASON 1 · SOLO</p>
<h1>RANKED<br>ISLAND</h1>
<h3>ONLY THE BEST SURVIVE</h3>
<p>Land on the island. Outsmart the bots. Climb the ranks.</p>
<button onclick="startGame()">PLAY SOLO</button>
<p>YOUR ISLAND. YOUR RANK.</p>
<p>SOLO BATTLE ROYALE · NO MULTIPLAYER</p>
</div>

<div id="game">
<div id="hud">
BOTS LEFT: <span id="botsLeft">5</span>
&nbsp; | &nbsp; ZONE: SAFE
&nbsp; | &nbsp; HEALTH: 100
</div>
<div id="help">WASD move · Mouse look · Space jump · Click to capture mouse</div>
<button id="exit" onclick="backToLobby()">EXIT</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

let scene,camera,renderer,player,clock;
let bots=[],keys={},yaw=0,pitch=0,started=false;
let velocityY=0,canJump=true;

function startGame(){
 document.getElementById('lobby').style.display='none';
 document.getElementById('game').style.display='block';
 if(!started) init();
 started=true;
}

function init(){
 clock=new THREE.Clock();
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x85d9ff);
 scene.fog=new THREE.Fog(0x85d9ff,50,160);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 document.getElementById('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x536b3b,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(40,80,30);
 sun.castShadow=true;
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.CylinderGeometry(85,95,8,64),
  new THREE.MeshStandardMaterial({color:0x4b9b43})
 );
 ground.position.y=-4;
 ground.receiveShadow=true;
 scene.add(ground);

 const grass=new THREE.Mesh(
  new THREE.CircleGeometry(85,64),
  new THREE.MeshStandardMaterial({color:0x65b94d})
 );
 grass.rotation.x=-Math.PI/2;
 grass.position.y=.05;
 scene.add(grass);

 const water=new THREE.Mesh(
  new THREE.CircleGeometry(150,64),
  new THREE.MeshStandardMaterial({color:0x258bc7})
 );
 water.rotation.x=-Math.PI/2;
 water.position.y=-8.2;
 scene.add(water);

 for(let i=0;i<90;i++){
  const a=Math.random()*Math.PI*2;
  const r=12+Math.random()*68;
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.35,.5,3,7),
   new THREE.MeshStandardMaterial({color:0x79502c})
  );
  trunk.position.set(x,1.5,z);
  scene.add(trunk);
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(2.5,6,8),
   new THREE.MeshStandardMaterial({color:0x176b35})
  );
  leaves.position.set(x,5,z);
  scene.add(leaves);
 }

 player=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(.65,1.1,4,8),
  new THREE.MeshStandardMaterial({color:0x267bff})
 );
 body.position.y=1.1;
 body.castShadow=true;
 player.add(body);
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.42,16,16),
  new THREE.MeshStandardMaterial({color:0xffc99b})
 );
 head.position.y=2.25;
 player.add(head);
 player.position.set(0,0,0);
 scene.add(player);

 bots=[];
 for(let i=0;i<5;i++){
  const bot=new THREE.Group();
  const body=new THREE.Mesh(
   new THREE.CapsuleGeometry(.6,1,4,8),
   new THREE.MeshStandardMaterial({color:0xe34b42})
  );
  body.position.y=1;
  bot.add(body);
  const head=new THREE.Mesh(
   new THREE.SphereGeometry(.4,12,12),
   new THREE.MeshStandardMaterial({color:0xffc99b})
  );
  head.position.y=2.1;
  bot.add(head);
  const a=Math.random()*Math.PI*2;
  const r=15+Math.random()*45;
  bot.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  bot.userData.direction=Math.random()*Math.PI*2;
  scene.add(bot);
  bots.push(bot);
 }

 window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space')e.preventDefault();
 });
 window.addEventListener('keyup',e=>keys[e.code]=false);

 renderer.domElement.addEventListener('click',()=>{
  renderer.domElement.requestPointerLock();
 });
 document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===renderer.domElement){
   yaw-=e.movementX*.002;
   pitch-=e.movementY*.002;
   pitch=Math.max(-.8,Math.min(.8,pitch));
  }
 });

 window.addEventListener('resize',resize);
 animate();
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function animate(){
 requestAnimationFrame(animate);
 if(!started)return;
 const dt=Math.min(clock.getDelta(),.05);

 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=new THREE.Vector3();

 if(keys.KeyW||keys.ArrowUp)move.add(forward);
 if(keys.KeyS||keys.ArrowDown)move.sub(forward);
 if(keys.KeyD||keys.ArrowRight)move.add(right);
 if(keys.KeyA||keys.ArrowLeft)move.sub(right);

 if(move.length()>0){
  move.normalize();
  player.position.addScaledVector(move,12*dt);
  player.rotation.y=Math.atan2(-move.z,move.x)-Math.PI/2;
 }

 if(keys.Space&&canJump){velocityY=9;canJump=false}
 velocityY-=24*dt;
 player.position.y+=velocityY*dt;
 if(player.position.y<0){player.position.y=0;velocityY=0;canJump=true}

 const distance=Math.hypot(player.position.x,player.position.z);
 if(distance>80){
  player.position.x*=80/distance;
  player.position.z*=80/distance;
 }

 bots.forEach(bot=>{
  bot.userData.direction+=(Math.random()-.5)*dt;
  bot.position.x+=Math.cos(bot.userData.direction)*3*dt;
  bot.position.z+=Math.sin(bot.userData.direction)*3*dt;
  if(Math.hypot(bot.position.x,bot.position.z)>75)
   bot.userData.direction+=Math.PI;
 });

 const target=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*10,
  player.position.y+5-Math.sin(pitch)*4,
  player.position.z+Math.cos(yaw)*10
 );
 camera.position.lerp(target,Math.min(1,dt*7));
 camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);

 renderer.render(scene,camera);
}

function backToLobby(){
 document.exitPointerLock();
 document.getElementById('game').style.display='none';
 document.getElementById('lobby').style.display='block';
 started=false;
 location.reload();
}
</script>
</body>
</html>
